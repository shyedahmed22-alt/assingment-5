<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issue Tracker</title>
    <!-- Daisy ui and tailwind -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link rel="stylesheet" href="style/style.css">
     <!--Font-->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
     <style>
    * {
     font-family: "Geist", sans-serif;
    }
     </style>
     <!-- fontawesome -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-[#F8FAFC]">
    <section class="min-h-screen flex justify-center items-center ">
        <fieldset class="fieldset w-2/4 mx-auto rounded-box border p-8 shadow-2xl border-none">

            <div class="flex justify-center mb-6">
                <img src="assets/github-logo.png"  alt="">
            </div>
            <div class="text-center mb-6">
                <h3 class="font-semibold text-2xl">GitHub Issues Tracker</h3>
                <p class="text-[#64748B]">Sign in to manage your issue</p>
            </div>
            <label class="label font-semibold text-black text-[18px]">Username</label>
            <input  id="username" type="email" class="input w-full" placeholder="Enter Username" />

            <label  class="label font-semibold text-black text-[18px]">Password</label>
            <input id="password" type="password" class="input w-full mb-6" placeholder="Enter Password" />

            <button id="signInBtn" class="btn btn-neutral mt-4">Sign In</button>
        </fieldset>
    </section>
    <script src="script/index.js"></script>
</body>
</html>
